          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SongVersion'
        '404':
          description: No such song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: create-song-version
      tags:
        - Songs
      summary: Add a tablature version
      description: |
        Add a version to a song.  The caller must hold
        `wikimusic:song-create`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongVersionInput'
      responses:
        '201':
          description: The version that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongVersion'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/versions/{versionId}:
    get:
      operationId: get-song-version
      tags:
        - Songs
      summary: Read one tablature version
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          description: The version's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongVersion'
        '404':
          description: No such version of that song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: update-song-version
      tags:
        - Songs
      summary: Edit a tablature version
      description: |
        Rewrite a version.  The caller must hold `wikimusic:song-create` and
        must have created the version, unless they hold
        `wikimusic:modify-permissions`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          description: The version's identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongVersionPatch'
      responses:
        '200':
          description: The version as it now reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongVersion'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not change this version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such version of that song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: delete-song-version
      tags:
        - Songs
      summary: Remove a tablature version
      description: |
        Remove a version.  The caller must hold `wikimusic:song-delete` and
        must have created the version, unless they hold
        `wikimusic:modify-permissions`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          description: The version's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The version was removed.
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not remove this version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such version of that song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/comments:
