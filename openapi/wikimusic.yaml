          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: create-song-comment
      tags:
        - Songs
      summary: Comment on a song
      description: Any signed-in reader may comment.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: The comment that was written.
          content:
