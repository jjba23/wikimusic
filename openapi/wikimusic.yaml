      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: artworkId
          in: path
          required: true
          description: The artwork's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The artwork was removed.
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not remove this artwork.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such artwork.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/artists:
