      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: artistId
          in: path
          required: true
          description: The artist's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The credit was removed.
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not remove this credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/genres:
    post:
      operationId: add-song-genre
      tags:
        - Songs
      summary: Put a song in a genre
      description: The caller must hold `wikimusic:song-create`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreRelationInput'
      responses:
        '204':
          description: The song belongs to the genre.
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such song or genre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/genres/{genreId}:
    delete:
      operationId: remove-song-genre
      tags:
        - Songs
      summary: Remove a song from a genre
      description: |
        The caller must hold `wikimusic:song-delete` and must have created the
        link, unless they hold `wikimusic:modify-permissions`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: genreId
          in: path
          required: true
          description: The genre's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
