            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtworkInput'
      responses:
        '201':
          description: The artwork that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artwork'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/artworks/{artworkId}:
    patch:
      operationId: update-song-artwork
      tags:
        - Songs
      summary: Edit artwork of a song
      description: |
        The caller must hold `wikimusic:song-create` and must have created the
        artwork, unless they hold `wikimusic:modify-permissions`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
