      responses:
        '200':
          description: The artwork as it now reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artwork'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not change this artwork.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
