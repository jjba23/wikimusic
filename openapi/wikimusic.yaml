          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/artists/{artistId}:
    delete:
      operationId: remove-song-artist
      tags:
        - Songs
      summary: Remove a song's credit of an artist
      description: |
        The caller must hold `wikimusic:song-delete` and must have created the
