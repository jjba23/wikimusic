              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/comments/{commentId}:
    patch:
      operationId: update-song-comment
      tags:
        - Songs
      summary: Edit a comment on a song
      description: Only the comment's author, or a super grant, may edit it.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          description: The comment's identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPatch'
      responses:
        '200':
          description: The comment as it now reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not change this comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: delete-song-comment
      tags:
        - Songs
      summary: Remove a comment on a song
      description: Only the comment's author, or a super grant, may remove it.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          description: The comment's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The comment was removed.
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not remove this comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/artworks:
    post:
      operationId: create-song-artwork
      tags:
