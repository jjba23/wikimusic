        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: How many matches to skip before the page starts.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: create-user
      tags:
        - Accounts
      summary: Add a user
      description: |
        The caller must hold `wikimusic:user-create`.  A password is optional:
        without one the account has no way in until a password is chosen.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: The user that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account already uses that email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{userId}:
    patch:
      operationId: update-user
      tags:
        - Accounts
      summary: Edit a user
      description: The caller must hold `wikimusic:modify-permissions`.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: The user as they now read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: delete-user
      tags:
        - Accounts
      summary: Remove a user
      description: The caller must hold `wikimusic:user-delete`.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The user was removed.
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instance:
    get:
      operationId: get-instance
      tags:
        - Instance
      summary: Read what this instance holds
      description: |
        The instance's name and the number of songs, artists, genres and
        articles it serves.  A client uses this to tell one instance from
        another and to show how much there is to read.
      responses:
        '200':
          description: This instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Error:
      type: object
      description: What went wrong, in a shape a client can show.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: A stable identifier for the kind of failure.
          example: not-found
        message:
          type: string
          description: A sentence for the person reading the client.
    ArtistRef:
      type: object
      description: An artist a song credits, without the artist's own details.
      required:
        - identifier
        - displayName
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
    GenreRef:
      type: object
      description: A genre a song belongs to, without the genre's own details.
      required:
        - identifier
        - displayName
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
    Artwork:
      type: object
      description: An image attached to a song, an artist or a genre.
      required:
        - identifier
        - contentUrl
        - orderValue
      properties:
        identifier:
          type: string
          format: uuid
        contentUrl:
          type: string
          format: uri
          description: Where the image is served from.
        contentCaption:
          type: string
          description: The caption shown under the image.
        orderValue:
          type: integer
          description: The position of the image among the entity's artwork.
    SongVersion:
      type: object
      description: |
        One version of a song's tablature.  The ASCII contents are the tab
        itself; a PDF or Guitar Pro file is reported by its presence so that a
        listing does not carry binary payloads.
      required:
        - identifier
        - versionName
        - instrumentType
      properties:
        identifier:
          type: string
          format: uuid
        versionName:
          type: string
          description: The name the contributor gave this version.
        instrumentType:
          type: string
          description: The instrument the tablature is written for.
          example: guitar
        asciiLegend:
          type: string
          description: The legend that explains the ASCII notation, when there is one.
        asciiContents:
          type: string
          description: The tablature in ASCII notation.
        hasPdf:
          type: boolean
          description: Whether a PDF of this version exists.
        hasTablature:
          type: boolean
          description: Whether a Guitar Pro file of this version exists.
        createdAt:
          type: string
          description: When the version was contributed, as an ISO 8601 timestamp.
    Comment:
      type: object
      description: A comment a reader wrote about an entity.
      required:
        - identifier
        - contents
      properties:
        identifier:
          type: string
          format: uuid
        parentIdentifier:
          type: string
          format: uuid
          description: The comment this one replies to, when it is a reply.
        contents:
          type: string
        createdBy:
          type: string
          format: uuid
          description: The user who wrote the comment.
        createdAt:
          type: string
    ExternalSource:
      type: object
      description: The addresses where an entity may be heard or read about.
      required:
        - identifier
      properties:
        identifier:
          type: string
          format: uuid
        spotifyUrl:
          type: string
          format: uri
        youtubeUrl:
          type: string
          format: uri
        soundcloudUrl:
          type: string
          format: uri
        wikipediaUrl:
          type: string
          format: uri
        createdAt:
          type: string
    SongSummary:
      type: object
      description: A song as a list shows it.
      required:
        - identifier
        - displayName
        - views
        - artists
        - genres
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        musicKey:
          type: string
          description: The key the song is written in.
          example: A minor
        musicTuning:
          type: string
          description: The tuning the song is played in.
          example: Drop D
        albumName:
          type: string
        views:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        dislikeCount:
          type: integer
          minimum: 0
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistRef'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreRef'
        createdAt:
          type: string
          description: When the song was added, as an ISO 8601 timestamp.
    Song:
      type: object
      description: One song, with everything the API says about it.
      required:
        - identifier
        - displayName
        - views
        - artists
        - genres
        - versions
        - artworks
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        musicKey:
          type: string
        musicTuning:
          type: string
        musicCreationDate:
          type: string
          description: When the song was written, as the contributor recorded it.
        albumName:
          type: string
        albumInfoLink:
          type: string
          format: uri
          description: A page with more about the album.
        views:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        dislikeCount:
          type: integer
          minimum: 0
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistRef'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreRef'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SongVersion'
        artworks:
          type: array
          items:
            $ref: '#/components/schemas/Artwork'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        externalSources:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSource'
        createdAt:
          type: string
    ArtistSummary:
      type: object
      description: An artist as a list shows them.
      required:
        - identifier
        - displayName
        - views
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        views:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        dislikeCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
    Artist:
      type: object
      description: One artist, with everything the API says about them.
      required:
        - identifier
        - displayName
        - views
        - artworks
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        views:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        dislikeCount:
          type: integer
          minimum: 0
        artworks:
          type: array
          items:
            $ref: '#/components/schemas/Artwork'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        externalSources:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSource'
        createdAt:
          type: string
    GenreSummary:
      type: object
      description: A genre as a list shows it.
      required:
        - identifier
        - displayName
        - views
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        views:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        dislikeCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
    Genre:
      type: object
      description: One genre, with everything the API says about it.
      required:
        - identifier
        - displayName
        - views
        - artworks
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        views:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        dislikeCount:
          type: integer
          minimum: 0
        artworks:
          type: array
          items:
            $ref: '#/components/schemas/Artwork'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        externalSources:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSource'
        createdAt:
          type: string
    ArticleSummary:
      type: object
      description: An article as a list shows it.
      required:
        - identifier
        - displayName
        - kind
        - views
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        kind:
          type: string
          enum:
            - tutorial
            - video
            - chord-guide
            - theory
            - discussion
        videoUrl:
          type: string
          format: uri
        views:
          type: integer
          minimum: 0
        createdAt:
          type: string
    Article:
      type: object
      description: One article, with everything the API says about it.
      required:
        - identifier
        - displayName
        - kind
        - contents
        - views
      properties:
        identifier:
          type: string
          format: uuid
        displayName:
          type: string
        kind:
          type: string
          enum:
            - tutorial
            - video
            - chord-guide
            - theory
            - discussion
        videoUrl:
          type: string
          format: uri
        contents:
          type: string
        views:
          type: integer
          minimum: 0
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ArticleComment'
        createdAt:
          type: string
    ArticleComment:
      type: object
      description: A comment an article carries.
      required:
        - identifier
        - contents
      properties:
        identifier:
          type: string
          format: uuid
        parentIdentifier:
          type: string
          format: uuid
        authorName:
          type: string
          description: The name a reader who was not signed in typed.
        createdBy:
          type: string
          format: uuid
        contents:
          type: string
        createdAt:
          type: string
    User:
      type: object
      description: An account of this instance.  A password is never returned.
      required:
        - identifier
        - username
        - email
        - permissions
      properties:
        identifier:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: array
          items:
            type: string
    Session:
      type: object
      description: The session a successful sign-in opened.
      required:
        - token
        - expiresIn
        - user
      properties:
        token:
          type: string
          description: Send this as `Authorization: Bearer <token>`.
        expiresIn:
          type: integer
          description: How long the token is good for, in seconds.
        user:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      description: The credentials a client signs in with.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    SongList:
      type: object
      description: One page of songs and the count of every match.
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SongSummary'
        total:
          type: integer
          minimum: 0
          description: Every match, before the page was cut.
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    ArtistList:
      type: object
      description: One page of artists and the count of every match.
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtistSummary'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    GenreList:
      type: object
      description: One page of genres and the count of every match.
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GenreSummary'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    ArticleList:
      type: object
      description: One page of articles and the count of every match.
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    UserList:
      type: object
      description: One page of users and the count of every match.
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    InstanceCounts:
      type: object
      description: How much of the encyclopaedia this instance holds.
      required:
        - songs
        - artists
        - genres
        - articles
      properties:
        songs:
          type: integer
          minimum: 0
        artists:
          type: integer
          minimum: 0
        genres:
          type: integer
          minimum: 0
        articles:
          type: integer
          minimum: 0
    Instance:
      type: object
      description: The instance a client is talking to.
      required:
        - name
        - version
        - counts
      properties:
        name:
          type: string
          description: The instance's own name.
        version:
          type: string
          description: The API version this instance serves.
          example: 1.1.0
        counts:
          $ref: '#/components/schemas/InstanceCounts'
    SongInput:
      type: object
      description: The fields a new song is written from.
      properties:
        displayName:
          type: string
        description:
          type: string
        musicKey:
          type: string
        musicTuning:
          type: string
        musicCreationDate:
          type: string
        albumName:
          type: string
        albumInfoLink:
          type: string
          format: uri
        artistIds:
          type: array
          items:
            type: string
            format: uuid
        genreIds:
          type: array
          items:
            type: string
            format: uuid
    SongPatch:
      type: object
      description: The fields of a song a client may rewrite.
      properties:
        displayName:
          type: string
        description:
          type: string
        musicKey:
          type: string
        musicTuning:
          type: string
        musicCreationDate:
          type: string
        albumName:
          type: string
        albumInfoLink:
          type: string
          format: uri
    ArtistInput:
      type: object
      description: The fields a new artist is written from.
      properties:
        displayName:
          type: string
        description:
          type: string
    ArtistPatch:
      type: object
      description: The fields of an artist a client may rewrite.
      properties:
        displayName:
          type: string
        description:
          type: string
    GenreInput:
      type: object
      description: The fields a new genre is written from.
      properties:
        displayName:
          type: string
        description:
          type: string
    GenrePatch:
      type: object
      description: The fields of a genre a client may rewrite.
      properties:
        displayName:
          type: string
        description:
          type: string
    SongVersionInput:
      type: object
      description: The fields a new tablature version is written from.
      properties:
        versionName:
          type: string
        instrumentType:
          type: string
        asciiLegend:
          type: string
        asciiContents:
          type: string
        pdfContents:
          type: string
          description: A PDF of the tablature, as the data URL the form posts.
        tablatureContents:
          type: string
          description: A Guitar Pro 5 file, as the data URL the form posts.
    SongVersionPatch:
      type: object
      description: The fields of a tablature version a client may rewrite.
      properties:
        versionName:
          type: string
        instrumentType:
          type: string
        asciiLegend:
          type: string
        asciiContents:
          type: string
        pdfContents:
          type: string
        tablatureContents:
          type: string
    ArtworkInput:
      type: object
      description: The fields a new artwork is written from.
      required:
        - contentUrl
      properties:
        contentUrl:
          type: string
          format: uri
        contentCaption:
          type: string
        orderValue:
          type: integer
    ArtworkPatch:
      type: object
      description: The fields of an artwork a client may rewrite.
      properties:
        contentUrl:
          type: string
          format: uri
        contentCaption:
          type: string
        orderValue:
          type: integer
    ExternalSourceInput:
      type: object
      description: The addresses where an entity may be heard or read about.
      properties:
        spotifyUrl:
          type: string
          format: uri
        youtubeUrl:
          type: string
          format: uri
        soundcloudUrl:
          type: string
          format: uri
        wikipediaUrl:
          type: string
          format: uri
    ExternalSourcePatch:
      type: object
      description: The addresses of an entity a client may rewrite.
      properties:
        spotifyUrl:
          type: string
          format: uri
        youtubeUrl:
          type: string
          format: uri
        soundcloudUrl:
          type: string
          format: uri
        wikipediaUrl:
          type: string
          format: uri
    CommentInput:
      type: object
      description: A comment to write about an entity.
      required:
        - contents
      properties:
        contents:
          type: string
        parentIdentifier:
          type: string
          format: uuid
    CommentPatch:
      type: object
      description: A comment to rewrite.
      required:
        - contents
      properties:
        contents:
          type: string
    ArtistRelationInput:
      type: object
      description: The artist to credit on a song.
      required:
        - artistId
      properties:
        artistId:
          type: string
          format: uuid
    GenreRelationInput:
      type: object
      description: The genre to put a song in.
      required:
        - genreId
      properties:
        genreId:
          type: string
          format: uuid
    ArticleInput:
      type: object
      description: The fields a new article is written from.
      required:
        - displayName
      properties:
        displayName:
          type: string
        kind:
          type: string
          enum:
            - tutorial
            - video
            - chord-guide
            - theory
            - discussion
          default: tutorial
        videoUrl:
          type: string
          format: uri
        contents:
          type: string
    ArticleCommentInput:
      type: object
      description: A comment to write about an article.
      required:
        - contents
      properties:
        contents:
          type: string
        parentIdentifier:
          type: string
          format: uuid
        authorName:
          type: string
          description: The name to show when the reader is not signed in.
    UserInput:
      type: object
      description: The fields a new account is written from.
      required:
        - username
        - email
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: array
          items:
            type: string
        password:
          type: string
          description: Optional; without one the account cannot sign in yet.
    UserPatch:
      type: object
      description: The fields of an account a client may rewrite.
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: array
          items:
            type: string
        password:
          type: string
