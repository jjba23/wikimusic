openapi: 3.0.3
info:
  title: Wikimusic
  version: 1.1.0
  description: |
    The API of a Wikimusic instance, the free music knowledge encyclopaedia.

    Every entity is identified by a UUID.  Reading is public; writing needs a
    session.  `POST /api/v1/login` exchanges an email and a password for a
    token, which a client sends as `Authorization: Bearer <token>`.  A route
    also enforces ownership: a row may be changed by the user who created it,
    or by a holder of the `wikimusic:modify-permissions` grant.

    Lists are paginated with `limit` and `offset`.  `total` counts every match
    before the page is cut, so a client can walk a whole collection a page at a
    time.
  license:
    name: MIT
    url: https://codeberg.org/jjba23/wikimusic/src/branch/main/LICENSE
servers:
  - url: https://wikimusic.jointhefreeworld.org
    description: The reference instance
  - url: http://127.0.0.1:50050
    description: A local development instance
tags:
  - name: Songs
    description: Songs, their tablature versions, artwork, comments and credits
  - name: Artists
    description: The people and groups a song is credited to
  - name: Genres
    description: The styles and traditions a song belongs to
  - name: Articles
    description: Tutorials, videos, chord guides, theory and discussions
  - name: Accounts
    description: Signing in and managing the instance's users
  - name: Instance
    description: What this instance holds
paths:
  /api/v1/songs:
    get:
      operationId: list-songs
      tags:
        - Songs
      summary: List songs
      description: |
        Songs of this instance, with the artists and genres each one credits.
        A search matches the name and the description.  The songs credited to
        one artist, or that belong to one genre, are the subresources below.
      parameters:
        - name: search
          in: query
          description: Only songs whose name or description contains this text.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: How many matches to skip before the page starts.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of songs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongList'
        '400':
          description: A query parameter is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: create-song
      tags:
        - Songs
      summary: Add a song
      description: |
        Add a song to this instance.  The caller must hold
        `wikimusic:song-create`.  `artistIds` and `genreIds` credit the song
        in the same request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongInput'
      responses:
        '201':
          description: The song that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session lacks the permission the route asks for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}:
    get:
      operationId: get-song
      tags:
        - Songs
      summary: Read one song
      description: |
        One song with its tablature versions, its artwork, comments, external
        sources and credits.  The versions are where a song's ASCII tablature
        lives; the PDF and Guitar Pro files are reported by their presence,
        not by their bytes.
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '404':
          description: No such song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: update-song
      tags:
        - Songs
      summary: Edit a song
      description: |
        Rewrite the fields of a song.  The caller must hold
        `wikimusic:song-create` and must have created the song, unless they
        hold `wikimusic:modify-permissions`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongPatch'
      responses:
        '200':
          description: The song as it now reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: The request body is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not change this song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: delete-song
      tags:
        - Songs
      summary: Remove a song
      description: |
        Remove a song and its credits.  The caller must hold
        `wikimusic:song-delete` and must have created the song, unless they
        hold `wikimusic:modify-permissions`.
      security:
        - bearerAuth: []
      parameters:
        - name: songId
          in: path
          required: true
          description: The song's identifier.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The song was removed.
        '401':
          description: No valid session was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The session may not remove this song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such song.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/songs/{songId}/versions:
    get:
      operationId: list-song-versions
      tags:
        - Songs
      summary: List a song's versions
      description: |
